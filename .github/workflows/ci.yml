name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # 테스트 명령은 .planespec.json 의 test(argv 배열) — 로컬 verify_gate 와 같은 명령.
      - run: eval "$(jq -r '.test | @sh' .planespec.json)"

  semgrep:
    # PR 이 새로 만든 문제만 본다(--baseline-commit). main 의 기존 문제(Apache 원본)는 제외.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: >-
          semgrep scan $(sed 's/^/--config /' semgrep/packs) --config semgrep/
          --baseline-commit ${{ github.event.pull_request.base.sha }}
          --error --metrics off --disable-version-check
